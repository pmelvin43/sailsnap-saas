version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sailsnap-db
    restart: always
    environment:
      POSTGRES_DB: sailsnap
      POSTGRES_USER: sailsnap
      POSTGRES_PASSWORD: sailsnappw
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailsnap -d sailsnap"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack
    container_name: sailsnap-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-west-1
      - EDGE_PORT=4566
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: sailsnap-backend
    restart: always
    depends_on:
      - db
      - localstack
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sailsnap
      SPRING_DATASOURCE_USERNAME: sailsnap
      SPRING_DATASOURCE_PASSWORD: sailsnappw
      AWS_REGION: us-west-1
      AWS_ACCESS_KEY: test
      AWS_SECRET_KEY: test
      AWS_ENDPOINT: http://localstack:4566
      STRIPE_SECRET_KEY: your_stripe_secret
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: sailsnap-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: