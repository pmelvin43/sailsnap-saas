version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sailsnap-db
    restart: always
    environment:
      POSTGRES_DB: sailsnap
      POSTGRES_USER: sailsnap
      POSTGRES_PASSWORD: sailsnappw
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailsnap -d sailsnap"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: sailsnap-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # These will override the properties file
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sailsnap
      SPRING_DATASOURCE_USERNAME: sailsnap
      SPRING_DATASOURCE_PASSWORD: sailsnappw
      AWS_REGION: ${AWS_REGION}
      AWS_ACCOUNT_ID: ${AWS_ACCOUNT_ID}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    command: >
      java -Denv=${ENV:-aws} -jar /app/sailsnap-saas.jar
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: sailsnap-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: