# Database - Docker environment
spring.datasource.url=jdbc:postgresql://db:5432/sailsnap
spring.datasource.username=sailsnap
spring.datasource.password=sailsnappw

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# Multipart file upload settings
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# FFmpeg settings (you'll need to install these in your Docker image)
ffmpeg.path=/usr/bin/ffmpeg
ffprobe.path=/usr/bin/ffprobe

# Logging for debugging
logging.level.com.sailsnap.backend=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.org.hibernate=DEBUG