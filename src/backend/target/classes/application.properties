spring.application.name=backend

# ---- Local database settings (used when NOT in Docker) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/sailsnap
spring.datasource.username=sailsnap
spring.datasource.password=sailsnappw

# ---- JPA settings ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Multipart file upload settings (important for media uploads!) ----
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ---- FFmpeg fallback ----
ffmpeg.path=/usr/bin/ffmpeg
ffprobe.path=/usr/bin/ffprobe

# Later, in production or Docker, you can override these values with environment variables:
# export FFMPEG_PATH=/app/ffmpeg/ffmpeg
# export FFPROBE_PATH=/app/ffmpeg/ffprobe